<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Álvaro</title>

    <link rel="icon" type="icon" href="./src/img/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./src/styles/colors.css">
    <link rel="stylesheet" href="./src/styles/style.css">
    <link rel="stylesheet" href="./src/styles/contact.css">
    <link rel="stylesheet" href="./src/styles/menu.css">
    <link rel="stylesheet" href="src/styles/buttons.css">
</head>
<body>
    <main class="contact-main">
        <section class="contact-hero">
            <h1 data-translate="contact-title">Let's Connect!</h1>
            <div class="content-divider"></div>
            <p class="contact-subtitle" data-translate="contact-subtitle">Choose how you want to get in touch</p>
        </section>

        <section class="contact-options">
            <div class="contact-card">
                <span class="card-emoji">📧</span>
                <h2>Email</h2>
                <p data-translate="email-desc">Send me a message anytime</p>
                <button onclick="copyEmail()" class="contact-button email-button" data-translate="email-button">Email Me</button>
            </div>

            <div class="contact-card">
                <span class="card-emoji">💼</span>
                <h2>LinkedIn</h2>
                <p data-translate="linkedin-desc">Let's connect professionally</p>
                <a href="https://www.linkedin.com/in/by-dev-sam/" target="_blank" class="contact-button" data-translate="linkedin-button">Connect</a>
            </div>

            <div class="contact-card">
                <span class="card-emoji">👨‍💻</span>
                <h2>GitHub</h2>
                <p data-translate="github-desc">Check out my projects</p>
                <a href="https://github.com/proAlvaroSam" target="_blank" class="contact-button" data-translate="github-button">Follow Me</a>
            </div>

            <div class="contact-card">
                <span class="card-emoji">💬</span>
                <h2>WhatsApp</h2>
                <p data-translate="whatsapp-desc">Let's chat directly</p>
                <a href="https://wa.me/5582998358859" target="_blank" class="contact-button" data-translate="whatsapp-button">Message Me</a>
            </div>
        </section>
    </main>

    <script src="./src/js/includeMenu.js"></script>
    <script src="./src/js/translations/contactTranslations.js"></script>
    <script src="./src/js/copyEmail.js"></script>
</body>
</html>
